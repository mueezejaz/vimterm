name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o vimterm.exe .

      - name: Package
        run: Compress-Archive -Path vimterm.exe -DestinationPath vimterm-windows-amd64.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vimterm.exe
            vimterm-windows-amd64.zip
          generate_release_notes: true
